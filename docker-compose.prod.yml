# Production-like stack — use managed Postgres/Redis in real deployments.
# Local smoke test: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    ports:
      - '3001:3001'
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ordering:${POSTGRES_PASSWORD:-ordering}@postgres:5432/ordering
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ordering}
